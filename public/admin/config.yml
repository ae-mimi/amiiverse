backend:
  name: git-gateway
  branch: master

media_folder: "public/assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "members"
    label: "Members"
    folder: "src/content/members"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Name", name: "name", widget: "string"}
      - {label: "Role", name: "role", widget: "string"}
      - {label: "Fun Fact", name: "fact", widget: "string"}
      - {label: "Image", name: "image", widget: "image"}

  - name: "music"
    label: "Music"
    folder: "src/content/music"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Date", name: "date", widget: "datetime"}
      - {label: "Cover Art", name: "cover", widget: "image"}
      - {label: "Spotify URL", name: "spotify", widget: "string", required: false}
      
  - name: "press"
    label: "Press"
    folder: "src/content/press"
    create: true
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Date", name: "date", widget: "datetime"}
      - {label: "Link / File", name: "file", widget: "file", required: false}

  - name: "shop"
    label: "Shop Items"
    folder: "src/content/shop"
    create: true
    fields:
      - {label: "Product Name", name: "title", widget: "string"}
      - {label: "Price", name: "price", widget: "string"}
      - {label: "Image", name: "image", widget: "image"}
      - {label: "Shop URL", name: "url", widget: "string"}

  - name: "pages"
    label: "Pages"
    folder: "src/content/pages"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "URL Slug", name: "slug", widget: "string"}
      - label: "Page Blocks"
        name: "blocks"
        widget: "list"
        types:
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Subtitle", name: "subtitle", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Image", name: "image", widget: "image"}
              - {label: "Primary CTA Text", name: "cta_primary", widget: "string"}
              - {label: "Primary CTA Link", name: "cta_primary_link", widget: "string"}
              - {label: "Secondary CTA Text", name: "cta_secondary", widget: "string"}
              - {label: "Secondary CTA Link", name: "cta_secondary_link", widget: "string"}

          - label: "Predebut Hero"
            name: "predebut_hero"
            widget: "object"
            fields:
              - {label: "Top Text", name: "top_text", widget: "string", default: "we are amii"}
              - {label: "Main Image", name: "image", widget: "image"}
              - {label: "Status Text", name: "status_text", widget: "string", default: "LOADING..."}
              - {label: "CTA Text", name: "cta_text", widget: "string", default: "JOIN THE QUEUE"}
              - {label: "CTA Link", name: "cta_link", widget: "string"}

          - label: "Intro Section"
            name: "intro"
            widget: "object"
            fields:
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Content", name: "content", widget: "text"}
              - {label: "Oval Image", name: "image", widget: "image"}

          - label: "Widget"
            name: "widget"
            widget: "object"
            fields:
              - label: "Widget Type"
                name: "widget_type"
                widget: "select"
                options: ["newsletter", "player"]

          - label: "Page Header"
            name: "page_hero"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Subtitle", name: "subtitle", widget: "string"}

          - label: "Rich Text"
            name: "rich_text"
            widget: "object"
            fields:
              - {label: "Body", name: "body", widget: "markdown"}

          - label: "Shop Grid"
            name: "shop_grid"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string", default: "Shop"}
              - {label: "Limit", name: "limit", widget: "number", default: 12}

          - label: "Music Grid"
            name: "music_grid"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string", default: "Music"}

          - label: "Press Grid"
            name: "press_grid"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string", default: "Press"}

          - label: "Members Grid"
            name: "members_grid"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string", default: "Members"}

          - label: "Contact Form"
            name: "contact_form"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string", default: "Contact Us"}
              - {label: "Form Endpoint", name: "endpoint", widget: "string"}
          
          - label: "Contact Section"
            name: "contact_section"
            widget: "object"
            fields:
              - {label: "Form Title", name: "title", widget: "string", default: "SAY HELLO"}
              - {label: "Form Subtitle", name: "subtitle", widget: "string", default: "Have a question, idea, or opportunity? Send us a message."}
              - {label: "Management Email", name: "management_email", widget: "string", default: "mgmt@amiiverse.com"}
              - {label: "Press Email", name: "press_email", widget: "string", default: "press@amiiverse.com"}
              - {label: "Bookings Email", name: "bookings_email", widget: "string", default: "bookings@amiiverse.com"}
              - {label: "Inquiries Email", name: "inquiries_email", widget: "string", default: "hello@amiiverse.com"}
              - {label: "Show Social Links", name: "show_socials", widget: "boolean", default: true}

  - name: "settings"
    label: "Settings"
    files:
      - name: "global"
        label: "Global Settings"
        file: "src/data/settings.json"
        fields:
          - {label: "Enable Follow Link", name: "enable_follow_link", widget: "boolean", default: false}
          - label: "Site Info"
            name: "site_info"
            widget: "object"
            fields:
              - {label: "Site Title", name: "title", widget: "string"}
              - {label: "Site Description", name: "description", widget: "text"}
              - {label: "Logo (Navy)", name: "logo_navy", widget: "image"}
              - {label: "Logo (Yellow)", name: "logo_yellow", widget: "image"}
              - {label: "Favicon", name: "favicon", widget: "image"}
          - label: "Navigation"
            name: "nav"
            widget: "list"
            fields:
              - {label: "Label", name: "label", widget: "string"}
              - {label: "URL", name: "href", widget: "string"}
          - label: "Footer"
            name: "footer"
            widget: "object"
            fields: 
              - label: "Footer Links"
                name: "links"
                widget: "list"
                fields:
                  - {label: "Label", name: "label", widget: "string"}
                  - {label: "URL", name: "href", widget: "string"}
                  - {label: "Is Special Link?", name: "is_special", widget: "boolean", default: false}
                  - {label: "Is Disabled?", name: "disabled", widget: "boolean", default: false}
              - {label: "Copyright Text", name: "copyright", widget: "string", default: "Copyright &copy; amii"}
          - label: "Socials"
            name: "socials"
            widget: "list"
            fields:
              - {label: "Platform Name", name: "platform", widget: "string"}
              - {label: "URL", name: "url", widget: "string"}
              - label: "Icon" 
                name: "icon" 
                widget: "select" 
                options: ["tiktok", "instagram", "youtube", "twitter", "facebook"]
